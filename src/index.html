<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MeuPeso</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f3f6f3" />
    <link rel="icon" type="image/x-icon" href="./assets/icon/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="tela-inicial">
      <section class="cartao-peso" aria-labelledby="titulo-peso">
        <h1 class="titulo-peso" id="titulo-peso">Você está pesando</h1>
        <div class="leitura-peso" aria-live="polite" aria-atomic="true">
          <span class="valor-peso" id="valor-peso">--,--</span>
          <span class="unidade-peso">kg</span>
        </div>
        <p class="mensagem-erro" id="mensagem-erro" role="status" hidden>
          Não foi possível carregar o peso.
        </p>
      </section>
    </main>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
